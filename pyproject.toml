[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-cad-rag"
version = "1.0.0"
description = "Text-to-CAD RAG Agent with Hybrid Retrieval and Python CAD Execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "chromadb>=0.4.24",
    "rank-bm25>=0.2.2",
    "trimesh>=4.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
